name: test

# One job, run on every PR and every push to main, so its check can be the
# required one on main (a required check that skips some PRs blocks them for ever).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Widget unit tests (Node)
        working-directory: packages/widget
        run: npm test

      - name: Install test dependencies
        run: |
          pip install -r packages/widget/tests/browser/requirements.txt -r e2e/requirements.txt
          python -m playwright install --with-deps chromium webkit
          npm ci --prefix packages/backend-node

      - name: Widget browser tests (Chromium, WebKit)
        run: python -m pytest -v packages/widget/tests/browser

      - name: Contract tests, both backends (e2e)
        run: python -m pytest -v e2e
